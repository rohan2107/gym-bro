name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymbro-api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'gymbro-api/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Python syntax
        run: python -m py_compile app/**/*.py
      
      - name: Verify imports
        run: |
          python -c "from app.main import app; print('✓ App imports successfully')"
          python -c "from app.models import User; print('✓ Models import successfully')"
          python -c "from app.auth_utils import create_jwt; print('✓ Auth utils import successfully')"
      
      - name: Run tests (non-DB)
        run: pytest tests/ -v --ignore-glob="**/test_*_integration.py" || echo "No tests to run"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymbro-web
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'gymbro-web/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run build
      
      - name: Check for console.log
        run: |
          if grep -r "console.log" src/ --exclude-dir=node_modules --exclude="*.min.js" 2>/dev/null; then
            echo "⚠️  Warning: console.log found in source files"
          else
            echo "✓ No console.log in source"
          fi

  vercel-config:
    name: Verify Deployment Config
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate vercel.json
        run: |
          if [ -f vercel.json ]; then
            python -m json.tool vercel.json > /dev/null && echo "✓ vercel.json is valid JSON"
          fi
      
      - name: Check required files
        run: |
          test -f api/handler.py && echo "✓ api/handler.py exists"
          test -f api/requirements.txt && echo "✓ api/requirements.txt exists"
          test -f gymbro-web/package.json && echo "✓ gymbro-web/package.json exists"

  vercel-preview:
    name: Test Preview Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for Vercel preview deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: vercel-preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
      
      - name: Smoke test preview deployment
        run: |
          echo "Testing preview at: ${{ steps.vercel-preview.outputs.url }}"
          curl -f "${{ steps.vercel-preview.outputs.url }}/api/health" || exit 1
          echo "✓ Preview deployment is healthy"