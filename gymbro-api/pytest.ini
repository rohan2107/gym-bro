[pytest]
# Pytest configuration for gym-bro backend

# Filter warnings
filterwarnings =
    # Ignore jose library's use of deprecated datetime.utcnow()
    # This is in the external jose library, not our code
    ignore::DeprecationWarning:jose.jwt

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options (can be overridden with --cov flags)
addopts = 
    --strict-markers
    -ra
    --tb=short

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
