# Ruff configuration.
#
# The rule set is stated explicitly rather than relying on ruff's defaults.
# CI installed ruff unpinned, so when ruff's default selection widened, the lint
# job started failing on code that had not changed - 202 findings on an
# untouched main. Pinning the version and naming the rules keeps lint
# reproducible across upgrades.
#
# This is ruff's historical default selection, which this codebase is clean
# against. Widening it (UP for modern typing syntax, DTZ for timezone-aware
# dates, I for import order) is worth doing deliberately as its own change.
line-length = 100
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test modules import fixtures for their side effects.
"tests/*" = ["F401"]
